name:    ProjetoWeb
version: "0.0.0"

dependencies:
- base
- yesod-core
- yesod
- persistent-sqlite
- text >= 1.2.4.0
- monad-logger >= 0.3.36
- yesod-static >= 1.6.1.0
- yesod-form
- shakespeare
- time

# The library contains all of our application code. The executable
# defined below is just a thin wrapper.
library:
  source-dirs: src

# Arquivos lidos em tempo de compilacao (templates e estaticos).
extra-source-files:
- routes.yesodroutes
- templates/*
- static/**/*

# Runnable executable for our application
executables:
  ProjetoWeb:
    main: Main.hs
    source-dirs: app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - ProjetoWeb
